/* ---- 打开 / 关闭 ---- */
function close_(){
  if(cur){
    try{
      if(cur.kind==='none'){/* 只是张图 */}
      else if(cur.kind==='spine'){
        // 别去调 assetManager/sceneRenderer 的 dispose: 实测那会让后面新建的 player
        // 拿到失效的 shader program(getUniformLocation 报 not of type WebGLProgram),
        // 丢掉 canvas 的 WebGL 上下文就够了
        if(cur.player&&cur.player.stopRendering)cur.player.stopRendering();
        if(cur.player)cur.player.paused=true;
        loseGL();
      }else{
        if(cur.loader)try{cur.loader.destroy()}catch(e){}
        try{dragonBones.PixiFactory.factory.clear(true)}catch(e){}
        if(cur.app)cur.app.destroy(true,{children:true,texture:true,baseTexture:true});
        try{PIXI.utils.clearTextureCache()}catch(e){}
      }
    }catch(e){}
    cur=null;
  }
  loseGL();$('stage').innerHTML='';$('ctl').innerHTML='';setst('');$('files').textContent='';
}
/* 连开几十套会撞浏览器的 WebGL 上下文上限(约 16 个), 关一套就主动丢一个 */
function loseGL(){
  [].forEach.call($('stage').querySelectorAll('canvas'),function(cv){
    try{var gl=cv.getContext('webgl')||cv.getContext('experimental-webgl');
        var x=gl&&gl.getExtension('WEBGL_lose_context');if(x)x.loseContext()}catch(e){}
  });
}
function hashOf(it){return '#'+encodeURIComponent(it.b+'/'+it.p)}
/* 深链: #<分组>/<路径> 开某一套; 后面再跟 |<动画名> 就直接播那个动画 */
var 指定动画='';
function fromHash(){
  var h='';try{h=decodeURIComponent((location.hash||'').slice(1))}catch(e){}
  if(!h)return -1;
  var k=h.indexOf('|');
  指定动画=k>=0?h.slice(k+1):'';
  if(k>=0)h=h.slice(0,k);
  for(var i=0;i<M.length;i++)if(M[i].b+'/'+M[i].p===h)return i;
  return -1;
}
function 默认动画(it){
  if(指定动画&&names(it).indexOf(指定动画)>=0)return 指定动画;
  return (it.def&&names(it).indexOf(it.def)>=0)?it.def:'';
}
function open_(i){
  close_();curI=i;var it=M[i];
  try{history.replaceState(null,'',hashOf(it))}catch(e){}
  $('ov').classList.add('on');
  $('ovn').textContent=it.p;
  $('ovm').textContent=it.b+' · '+it.f+' · 骨'+it.bone+' 槽'+it.slot+' 皮'+it.skin+' · '+it.a.length+' 动画'+(it.sz?' · 图集 '+it.sz+(it.real&&it.real!==it.sz?' (实际 '+it.real+')':'')+(it.texfmt?' '+it.texfmt:''):'');
  var fl=[it.main].concat(it.e==='db'?[it.tex,it.img]:[it.atlas||''].concat(it.pages||[])).filter(Boolean);
  $('files').textContent=it.d+'/  ['+fl.join('  |  ')+']'+(it.note?'   — '+it.note:'');
  $('bpma').style.display=it.e.indexOf('spine')===0?'':'none';
  if(it.bad){setst('这套缺文件，播不了：'+it.bad,true);return}
  if(it.e==='none')openNone(it);
  else if(it.e==='db')openDB(it);
  else openSpine(it);
}

/* ---- Spine: 用 spine-player 3.8 自带控件(时间轴/动画/皮肤/速度/调试) ---- */
/* 两个版本的 spine-player 都把自己挂在全局 spine 上, 页面里按加载顺序抢存成 spine38/spine40 */
function SPNS(e){return (e==='spine40'?window.spine40:window.spine38)||window.spine}
function openSpine(it){
  var NS=SPNS(it.e);
  if(!NS||!NS.SpinePlayer){setst('这一套要 '+it.e+' 运行时, 但页面里没加载到',true);return}
  var host=document.createElement('div');host.className='sphost';$('stage').appendChild(host);
  var cfg={atlasUrl:u(it.d+'/'+it.atlas),alpha:true,backgroundColor:'#00000000',
    premultipliedAlpha:PMA,showControls:true,showLoading:true,defaultMix:0,
    success:function(){if(卡住)clearTimeout(卡住);setst('已加载 · 播放控件在画面下方(齿轮调速 / 人形切动画 / 衣架切皮肤)')},
    error:function(p,msg){if(卡住)clearTimeout(卡住);setst('加载失败: '+msg,true)}};
  // 每套 Spine 都要一个新的 WebGL 上下文, 浏览器同时只给十几个。连着开几十套后
  // 新的 player 可能既不回 success 也不报错, 就卡在加载中 —— 这时候提示刷新比干等强
  var 卡住=setTimeout(function(){
    if(($('st').textContent||'').indexOf('加载中')===0)
      setst('12 秒没加载出来。连开很多套之后浏览器的 WebGL 上下文会用尽, 刷新页面再打开这一套通常就好了。',true);
  },12000);
  var 首=默认动画(it);if(首)cfg.animation=首;
  $('ctl').innerHTML='<label>Spine 用运行时自带控件; 预览图当时挑的姿势是 <b>'+esc(it.def||'setup pose')+'</b></label>';
  setst('加载中...');
  var url=u(it.d+'/'+it.main);
  if(it.main.slice(-5).toLowerCase()==='.skel'){cfg.skelUrl=url;起(host,cfg);return}
  if(!it.conv){cfg.jsonUrl=url;起(host,cfg);return}
  var tag=it.d+'/'+it.main;
  fetch(url).then(function(r){return r.json()}).then(function(j){
    if(!cur||cur.tag!==tag)return;
    cfg.jsonUrl='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(to38(j)));
    起(host,cfg);
    setst('已加载(骨架是 Spine 3.6 格式, 已在浏览器里转成 3.8 形状再喂给运行时)');
  }).catch(function(e){setst('3.6 骨架转换失败: '+e.message,true)});
  cur={kind:'spine',player:null,tag:tag};
  function 起(h,c){try{cur={kind:'spine',player:new NS.SpinePlayer(h,c),tag:tag}}
    catch(e){setst('spine-player 起不来: '+e.message,true)}}
}
/* Spine 3.6/3.7 -> 3.8 的 JSON 形状差异, 只补真正会让画面全空或插值乱掉的三处 */
function to38(j){
  if(j.skins&&!Array.isArray(j.skins)){
    j.skins=Object.keys(j.skins).map(function(n){return {name:n,attachments:j.skins[n]}});
  }
  for(var a in j.animations||{}){
    var an=j.animations[a];
    if(an.ffd&&!an.deform){an.deform=an.ffd;delete an.ffd}
  }
  曲线(j.animations);
  return j;
}
/* 3.6 的 curve 是 [c1,c2,c3,c4], 3.8 读的是 curve/c2/c3/c4 四个标量 */
function 曲线(o){
  if(!o||typeof o!=='object')return;
  if(Array.isArray(o)){for(var i=0;i<o.length;i++)曲线(o[i]);return}
  if(Array.isArray(o.curve)&&o.curve.length===4){
    var c=o.curve;o.curve=c[0];o.c2=c[1];o.c3=c[2];o.c4=c[3];
  }
  for(var k in o)if(k!=='curve')曲线(o[k]);
}
function names(it){return it.a.map(function(a){return a.n})}
/* 浏览器里没有对应运行时的格式(比如 LayaAir 的 .sk): 退回静态核对图, 把原因说清楚 */
function openNone(it){
  var d=document.createElement('div');
  d.style.cssText='width:100%;height:100%;display:flex;align-items:center;justify-content:center';
  d.innerHTML=it.t?'<img src="'+u(it.t)+'" style="max-width:96%;max-height:96%">'
                 :'<span style="color:#6f7783">没有核对图</span>';
  $('stage').appendChild(d);
  $('ctl').innerHTML='<label>'+esc(it.a.length?('动画: '+names(it).join(' / ')):'没有动画')+'</label>';
  cur={kind:'none'};
  setst(it.why||'这个格式浏览器里没有可用的运行时, 只能看静态核对图', true);
}

/* ---- DragonBones: pixi5 + dragonBones 5.7 的 PixiFactory, 控件自己搭 ---- */
var BASE=1,ZOOM=1,PAN={x:0,y:0},DRAG=null;
function openDB(it){
  var app=new PIXI.Application({transparent:true,antialias:true,resizeTo:$('stage'),
    sharedTicker:true,resolution:window.devicePixelRatio||1,autoDensity:true});
  $('stage').appendChild(app.view);
  var ld=new PIXI.Loader();
  cur={kind:'db',app:app,loader:ld,it:it,disp:null,fb:null,anim:'',loop:true,speed:1,playing:true};
  setst('加载中...');
  ld.add('ske',u(it.d+'/'+it.main),{xhrType:'json'})
    .add('tex',u(it.d+'/'+it.tex),{xhrType:'json'})
    .add('img',u(it.d+'/'+it.img));
  ld.onError.add(function(e,l,res){setst('资源加载失败: '+((res&&res.url)||'')+' '+((e&&e.message)||e),true)});
  ld.load(function(_,res){
    if(!cur||cur.loader!==ld)return;
    try{
      var f=dragonBones.PixiFactory.factory;
      f.parseDragonBonesData(res.ske.data);
      f.parseTextureAtlasData(res.tex.data,res.img.texture.baseTexture);
      var disp=f.buildArmatureDisplay(it.arm);
      if(!disp)throw new Error('buildArmatureDisplay("'+it.arm+'") 返回空, 骨架名对不上');
      var root=new PIXI.Container();root.addChild(disp);app.stage.addChild(root);
      cur.disp=disp;cur.root=root;
      dbCtl(it);
      dbPlay(默认动画(it)||(it.a[0]&&it.a[0].n));
      setst('已加载 · 拖动画面可平移');
      app.ticker.add(dbTick);
      requestAnimationFrame(dbFit);
    }catch(e){setst('DragonBones 解析失败: '+e.message,true)}
  });
}
function dbDur(n){
  for(var i=0;i<cur.it.a.length;i++)if(cur.it.a[i].n===n)return parseFloat(cur.it.a[i].d)||0;
  return 0;
}
/* 单帧的包围盒只够摆一个姿势, 播起来常跑出画面; 这里在真播的头一轮里累积并集再定镜头,
   全程不碰骨架状态(手动 advanceTime 去采样会把动画推到结尾, 那一帧很多特效是全隐藏的) */
function dbFit(){
  if(!cur||cur.kind!=='db')return;
  cur.meas={box:null,t:0,done:false};
  ZOOM=1;PAN={x:0,y:0};
  var z=$('zoom');if(z)z.value=1;
  dbGrow();
}
function fin(v){return typeof v==='number'&&isFinite(v)}
function dbGrow(){
  if(!cur||cur.kind!=='db'||!cur.disp||!cur.meas)return;
  var b=cur.disp.getLocalBounds();
  if(b&&b.width>0&&b.height>0&&fin(b.x)&&fin(b.y)&&fin(b.width)&&fin(b.height)){
    var m=cur.meas.box;
    if(!m)cur.meas.box={x0:b.x,y0:b.y,x1:b.x+b.width,y1:b.y+b.height};
    else{m.x0=Math.min(m.x0,b.x);m.y0=Math.min(m.y0,b.y);
         m.x1=Math.max(m.x1,b.x+b.width);m.y1=Math.max(m.y1,b.y+b.height)}
  }
  var m=cur.meas.box;
  if(!m){cur.fb={x:-50,y:-50,width:100,height:100}}
  else{cur.fb={x:m.x0,y:m.y0,width:Math.max(1,m.x1-m.x0),height:Math.max(1,m.y1-m.y0)}}
  var s=Math.min(cur.app.screen.width*0.86/cur.fb.width,cur.app.screen.height*0.86/cur.fb.height);
  BASE=(fin(s)&&s>0)?s:1;
  dbApply();
}
function dbApply(){
  if(!cur||cur.kind!=='db'||!cur.disp||!cur.fb)return;
  var s=BASE*ZOOM,b=cur.fb;
  if(!fin(s)||s<=0||!fin(b.x)||!fin(b.y))return;
  cur.root.scale.set(s);
  cur.root.position.set(cur.app.screen.width/2-(b.x+b.width/2)*s+PAN.x,
                        cur.app.screen.height/2-(b.y+b.height/2)*s+PAN.y);
}
function dbPlay(n){
  if(!cur||!cur.disp||!n)return;
  cur.anim=n;
  cur.disp.animation.play(n,cur.loop?0:1);
  cur.disp.animation.timeScale=cur.playing?cur.speed:0;
  var s=$('anim');if(s&&s.value!==n)s.value=n;
}
function dbTick(){
  if(!cur||cur.kind!=='db'||!cur.disp)return;
  if(cur.meas&&!cur.meas.done){
    cur.meas.t+=cur.app.ticker.deltaMS/1000;
    dbGrow();
    if(cur.meas.t>Math.min(dbDur(cur.anim)||1.5,4)+0.1)cur.meas.done=true;
  }
  var bar=$('progi');if(!bar)return;
  try{
    var st=cur.disp.animation.lastAnimationState,d=0;
    for(var i=0;i<cur.it.a.length;i++)if(cur.it.a[i].n===cur.anim)d=parseFloat(cur.it.a[i].d)||0;
    if(st&&d>0)bar.style.width=((st.currentTime%d)/d*100).toFixed(1)+'%';
  }catch(e){}
}

function dbCtl(it){
  $('ctl').innerHTML='<select id=anim></select>'+
    '<button id=bplay>暂停</button>'+
    '<label>速度 <input id=spd type=range min=0.1 max=3 step=0.1 value=1 style="width:110px;vertical-align:middle"> <span id=spdv>1.0x</span></label>'+
    '<label><input id=lp type=checkbox checked> 循环</label>'+
    '<label><input id=dbg type=checkbox> 骨骼</label>'+
    '<label>缩放 <input id=zoom type=range min=0.1 max=4 step=0.05 value=1 style="width:110px;vertical-align:middle"></label>'+
    '<button id=bfit>重新适配</button>'+
    '<div id=prog><i id=progi></i></div>';
  var s=$('anim');
  it.a.forEach(function(a){s.add(new Option(a.n+'  ('+a.d+'s'+(a.l?' 循环':'')+')',a.n))});
  s.onchange=function(){var auto=(ZOOM===1&&PAN.x===0&&PAN.y===0);dbPlay(this.value);if(auto)dbFit()};
  $('bplay').onclick=function(){
    cur.playing=!cur.playing;this.textContent=cur.playing?'暂停':'播放';
    cur.disp.animation.timeScale=cur.playing?cur.speed:0;
  };
  $('spd').oninput=function(){
    cur.speed=parseFloat(this.value);$('spdv').textContent=cur.speed.toFixed(1)+'x';
    if(cur.playing)cur.disp.animation.timeScale=cur.speed;
  };
  $('lp').onchange=function(){cur.loop=this.checked;dbPlay(cur.anim)};
  $('dbg').onchange=function(){try{cur.disp.debugDraw=this.checked}catch(e){setst('这套画不了调试骨骼: '+e.message,true)}};
  $('zoom').oninput=function(){ZOOM=parseFloat(this.value);if(cur.meas)cur.meas.done=true;dbApply()};
  $('bfit').onclick=dbFit;
}
$('stage').addEventListener('mousedown',function(e){
  if(cur&&cur.kind==='db'){DRAG={x:e.clientX,y:e.clientY,px:PAN.x,py:PAN.y};e.preventDefault()}
});
window.addEventListener('mousemove',function(e){
  if(DRAG){PAN.x=DRAG.px+(e.clientX-DRAG.x);PAN.y=DRAG.py+(e.clientY-DRAG.y);if(cur&&cur.meas)cur.meas.done=true;dbApply()}
});
window.addEventListener('mouseup',function(){DRAG=null});
window.addEventListener('resize',function(){if(cur&&cur.kind==='db')dbApply()});
(function(){var h=fromHash();if(h>=0)open_(h)})();

/* ?selftest: 依次开完每一套, 只看加载成不成(渲染对不对还得看图), 结果写进 #selftest,
   无头跑 msedge --headless --virtual-time-budget=N --dump-dom 就能把结果抓出来 */
if(/[?&]selftest/.test(location.search))setTimeout(自检,200);
function 自检(){
  var box=document.createElement('pre');box.id='selftest';
  box.style.cssText='background:#1c1f25;border:1px solid #2c313a;border-radius:8px;padding:12px;white-space:pre-wrap;position:relative;z-index:99';
  document.body.insertBefore(box,document.body.firstChild);
  var i=0,res=[],t0=Date.now();
  function 下一个(){
    if(i>=M.length)return 收尾();
    var it=M[i],st=$('st'),开始=Date.now();
    // 本来就播不了的(没有运行时 / 缺文件)不算失败, 单独计一档
    if(it.e==='none'||it.bad){res.push({n:it.b+'/'+it.p,f:it.f,skip:1});i++;return setTimeout(下一个,5)}
    open_(i);
    var t=setInterval(function(){
      var txt=st.textContent||'',ok=txt.indexOf('已加载')===0,bad=st.className==='err';
      if(ok||bad||Date.now()-开始>20000){
        clearInterval(t);
        res.push({n:it.b+'/'+it.p,f:it.f,ok:ok&&!bad,msg:bad?txt:(ok?'':'20 秒没出结果')});
        i++;setTimeout(下一个,20);
      }
    },60);
  }
  function 收尾(){
    close2();
    var 跳=res.filter(function(r){return r.skip});
    var 坏=res.filter(function(r){return !r.ok&&!r.skip});
    var 该=res.length-跳.length;
    var 行=['自检完成: '+(该-坏.length)+'/'+该+' 套加载成功'+(跳.length?(', 另有 '+跳.length+' 套本来就播不了(不计)'):'')+
            ', 用时 '+((Date.now()-t0)/1000).toFixed(0)+'s'];
    if(坏.length){行.push('');行.push('失败 '+坏.length+' 套:');
      坏.forEach(function(r){行.push('  ['+r.f+'] '+r.n+' -> '+r.msg)})}
    box.textContent=行.join(String.fromCharCode(10));
    document.title='SELFTEST '+(该-坏.length)+'/'+该;
  }
  下一个();
}
</script>
