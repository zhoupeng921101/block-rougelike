<text class="note" x="56" y="1320">粉色链 = 燃料在小丑池之外（塔罗/幽灵产出）。X倍率占比最高的强化牌流（50%），燃料 100% 靠塔罗——这是一条跨内容类型的依赖，光看小丑池看不出来。</text>
<text class="note" x="56" y="1338">吸血鬼那组值得单说：它自己是强化牌流的 X倍率卡（每吃一张 X0.1），但吃法正好摧毁同流派另外四张的存量。同一流派内部自带互斥线。</text>
